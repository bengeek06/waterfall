name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'openapi/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
              - 'infra/docker/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/api-client-ts/**'
              - 'openapi/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            contract:
              - 'openapi/**'
              - 'packages/api-client-ts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: waterfall
          POSTGRES_PASSWORD: waterfall
          POSTGRES_DB: waterfall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterfall -d waterfall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Pytest
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://waterfall:waterfall@localhost:5432/waterfall
        run: pytest -q

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run frontend:lint

      - name: Frontend test
        run: npm run frontend:test

      - name: Frontend build
        run: npm run frontend:build

  contract-quality:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle OpenAPI spec
        run: npm run openapi:bundle

      - name: Verify bundled OpenAPI spec is committed
        run: git diff --exit-code -- openapi/waterfall_v1.yaml

      - name: Regenerate OpenAPI TypeScript client
        run: npm run api-client:generate

      - name: Verify generated client is committed
        run: git diff --exit-code -- packages/api-client-ts/src/generated/api-types.ts
