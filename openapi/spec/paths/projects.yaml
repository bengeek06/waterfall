      in: query
      required: false
      schema:
        type: [integer, "null"]
        minimum: 1
    responses:
      '200':
        description: >-
          Integralite des taches du projet (non pagine : cet endpoint
          alimente l'editeur de planning, qui a besoin de l'arbre complet
          pour reconstruire la hierarchie et calculer les durees des
          taches synthese -- une troncature produirait des parents
          orphelins et des agregats faux).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/TaskListRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/ProjectNotFound.yaml
