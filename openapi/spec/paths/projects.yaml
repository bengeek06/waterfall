/projects:
  get:
    tags:
    - projects
    summary: Lister les projets importes
    description: 'Le parametre `q` recherche sur `name`.'
    operationId: listProjects
    security:
    - bearerAuth: []
    parameters:
    - name: include_archived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Search.yaml
    - name: sort
      in: query
      required: false
      schema:
        allOf:
        - $ref: ../components/schemas/SortColumn.yaml
        enum: [name, -name, status, -status, id, -id]
    responses:
      '200':
        description: Liste de projets
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProjectListRead.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
  post:
    tags:
    - projects
    summary: Creer un projet sans import
    operationId: createProject
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectCreate.yaml
    responses:
      '201':
        description: Projet cree
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProjectRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
/projects/setup-warnings:
  get:
    tags:
    - projects
    summary: Verifier le parametrage global avant la creation d'un projet
    description: |-
      Verifie les 3 prerequis de parametrage global verifiables independamment
      de tout projet (issue #109) : un calendrier actif flague par defaut avec
      au moins un jour travaille, au moins une categorie de cout active, et au
      moins un role de ressource actif. Purement informatif : ne bloque jamais
      `POST /projects`, qui reste possible meme si des avertissements sont
      retournes.
    operationId: getProjectSetupWarnings
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Liste des prerequis de parametrage manquants (vide si le parametrage est complet)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProjectSetupWarningsRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
/projects/{projectId}:
