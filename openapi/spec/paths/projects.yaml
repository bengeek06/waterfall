/projects/{projectId}/tasks/{taskUid}:
  patch:
    tags:
    - projects
    summary: Mettre a jour le nom et/ou la description d'une tache
    description: >-
      Issue #290 (E12-08) a ajoute le champ optionnel `name`, en plus du
      champ `description` preexistant. Quand un planning est affiche, le
      renommage met a jour `WfPlanningTaskSnapshot.name` et son jumeau
      `MsTask.name` dans la meme transaction ; sinon, `MsTask.name` seul.
      Ce renommage est immediatement visible sur toutes les lignes de
      taches d'un devis brouillon referencant cette tache (voir
      `EstimateTaskRowRead`).
    operationId: updateTask
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/TaskUid.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TaskUpdate.yaml
    responses:
      '200':
        description: Tache mise a jour
        content:
          application/json:
            schema:
              $ref: ../components/schemas/TaskRead.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/TaskNotFound.yaml
