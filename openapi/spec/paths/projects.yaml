/projects:
  get:
    tags:
    - projects
    summary: Lister les projets importes
    operationId: listProjects
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: include_archived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    responses:
      '200':
        description: Liste de projets
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/ProjectRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
  post:
    tags:
    - projects
    summary: Creer un projet sans import
    operationId: createProject
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectCreate.yaml
    responses:
      '201':
        description: Projet cree
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProjectRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
/projects/{projectId}:
  get:
    tags:
    - projects
    summary: Lire un projet
    operationId: getProject
    security:
    - bearerAuth: []
    parameters:
