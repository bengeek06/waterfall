        description: Projet modifie
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProjectRead.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/ProjectNotFound.yaml
  delete:
    tags:
    - projects
    summary: Supprimer un projet
    operationId: deleteProject
    security:
    - bearerAuth: []
    parameters:
