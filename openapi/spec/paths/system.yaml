/health:
  get:
    tags:
    - health
    summary: Vérifier la disponibilité de l'API
    operationId: getHealth
    security: []
    responses:
      '200':
        description: API disponible
        content:
          application/json:
            schema:
              $ref: ../components/schemas/HealthStatus.yaml
/health/ready:
  get:
    tags:
    - health
    summary: Vérifier que l'API est prête
    description: >-
      Contrôle effectif des dépendances (Postgres, Redis, stockage objet), chacune sous
      un délai court : une dépendance qui ne répond pas est comptée en échec. Utilisé par
      le healthcheck Docker du service `api`. Ne pas confondre avec `GET /health`, qui est
      une sonde de vivacité et ne contacte volontairement aucune dépendance.
    operationId: getReadiness
    security: []
    responses:
      '200':
        description: API prête, toutes les dépendances répondent
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ReadinessStatus.yaml
      '503':
        description: >-
          Au moins une dépendance est injoignable. Même corps qu'en 200 : `checks`
          identifie la ou les dépendances en cause.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ReadinessStatus.yaml
/metrics:
  get:
    tags:
    - observability
    summary: Exposer les métriques Prometheus
    operationId: getMetrics
    security: []
    responses:
      '200':
        description: Métriques Prometheus
        content:
          text/plain:
            schema:
              type: string
