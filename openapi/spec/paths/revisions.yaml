/projects/{projectId}/revisions:
  get:
    tags:
    - projects
    summary: Lister les revisions d'un projet
    description: >-
      La seule lecture qui repond « quelles revisions existent » (E14-10). Avant elle,
      un identifiant de revision n'atteignait un client que comme sous-produit d'un
      import (`ImportRunAcceptedResponse.revisionId`) : aucune autre revision que celle
      qui venait d'etre importee n'etait ouvrable, donc ni historique, ni ouverture en
      lecture seule d'une revision validee, ni copie vers un brouillon. Volontairement
      pas de `GET .../revisions/{revisionId}` a cote : l'en-tete d'une revision revient
      deja avec son arbre sur `GET .../nodes`.
    operationId: listRevisions
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    responses:
      '200':
        description: Revisions du projet, de la plus ancienne a la plus recente
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionListRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
/projects/{projectId}/revisions/{revisionId}/nodes:
  get:
    tags:
    - projects
    summary: Lire l'arbre d'une revision et sa facette planification
    description: >-
      Retourne les noeuds de la revision en ordre depth-first, chacun avec son
      identifiant positionnel (`row_number`) et son niveau (`level`) calcules a la
      lecture et stockes nulle part, ainsi que sa facette. Volontairement non
      pagine : cet endpoint alimente un arbre editable, qui a besoin de l'arbre
      complet pour reconstruire la hierarchie et numeroter les lignes.
    operationId: readRevisionNodes
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    responses:
      '200':
        description: Arbre complet de la revision, en ordre depth-first
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionTreeRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/aggregates:
  get:
    tags:
    - projects
    summary: Lire les totaux d'une revision
    description: >-
      Totaux calcules a partir des facettes cout de la revision, pas de lignes figees :
      un brouillon a donc un total, ce que le devis historique ne savait pas produire.
      La tache porteuse de chaque ligne est resolue dans l'arbre (INV-01), jamais lue
      dans une colonne, et une facette cout placee a la racine -- sans tache porteuse --
      compte dans le total comme les autres. Un taux horaire ou un coefficient
      d'inflation manquant est signale dans le corps de la reponse et jamais leve : ceci
      est une lecture, et un 500 rendrait illisible un brouillon parfaitement editable.
      `unpriceable_facets` signale de la meme maniere les chiffrages que le moteur n'a
      pu rattacher a aucune annee, que `missing_cost_rates` ne peut pas nommer et sur
      lesquels la validation refuse desormais.
    operationId: readRevisionAggregates
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    responses:
      '200':
        description: Totaux de la revision, avec les couvertures de taux manquantes
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionAggregatesRead.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/tasks:
  post:
    tags:
    - projects
    summary: Creer un noeud tache dans une revision
    operationId: createRevisionTask
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionTaskCreate.yaml
    responses:
      '201':
        description: Noeud cree, avec le nouveau `lock_version` de la revision
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionNodeWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/nodes/move:
  post:
    tags:
    - projects
    summary: Deplacer une selection de noeuds d'une revision
    description: >-
      Volontairement agnostique de la facette : il n'y a qu'un arbre, donc deplacer
      une ligne de cout et deplacer une tache sont la meme operation. Chaque noeud
      selectionne emporte son sous-arbre et ses deux facettes ; un noeud dont un
      ancetre est aussi selectionne est porte par cet ancetre plutot que deplace
      deux fois.
    operationId: moveRevisionNodes
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionNodeMove.yaml
    responses:
      '200':
        description: Deplacement applique, avec le nouveau `lock_version`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/nodes/delete:
  post:
    tags:
    - projects
    summary: Supprimer une selection de noeuds en cascade
    description: >-
      Supprime la selection, tout son sous-arbre et les deux facettes de chaque
      noeud retire (INV-02). La reponse nomme le chiffrage emporte
      (`cost_losses`) plutot que de le laisser disparaitre silencieusement.
    operationId: deleteRevisionNodes
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionNodeDelete.yaml
    responses:
      '200':
        description: Suppression appliquee, avec le chiffrage emporte
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionNodeDeleteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/nodes/{nodeId}/planning:
  patch:
    tags:
    - projects
    summary: Modifier la facette planification d'un noeud
    description: >-
      Edition partielle : duree, dates, avancement, calendrier, jalon, mode
      manuel/automatique. Un champ absent est laisse tel quel ; `null` est une
      valeur. Quel que soit le nombre d'attributs modifies, `lock_version`
      n'avance que d'un cran.
    operationId: updateRevisionPlanFacet
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    - $ref: ../components/parameters/RevisionNodeId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionPlanFacetUpdate.yaml
    responses:
      '200':
        description: Facette mise a jour, avec le nouveau `lock_version`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/nodes/{nodeId}/predecessors:
  put:
    tags:
    - projects
    summary: Remplacer les predecesseurs d'un noeud tache
    description: >-
      Remplace l'integralite des liens de precedence arrivant sur le noeud. Un
      predecesseur designant un noeud d'une autre revision est refuse (INV-08,
      `detail.code` = REVISION_CROSS_REVISION).
    operationId: replaceRevisionPredecessors
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    - $ref: ../components/parameters/RevisionNodeId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionPredecessorsReplace.yaml
    responses:
      '200':
        description: Predecesseurs remplaces, avec le nouveau `lock_version`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/cost-lines:
  post:
    tags:
    - projects
    summary: Creer un noeud ligne de cout dans une revision
    description: >-
      Le pendant de `POST .../tasks` sur la facette cout, dans le meme arbre : une
      ligne MO porte un role et des heures, une ligne non-MO un type de cout, une
      categorie et un debours (INV-19, INV-20) ; toute autre forme est refusee avec
      `detail.code` = REVISION_FACET_CONTRACT. `parent_id` absent place la ligne a
      la racine, ou elle est un cout global de projet sans tache porteuse (INV-01),
      ce qui est explicitement autorise. Rattacher une ligne a une tache-jalon est
      refuse par le domaine (INV-27, `detail.code` = REVISION_MILESTONE_HAS_CHILDREN).
    operationId: createRevisionCostLine
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionCostLineCreate.yaml
    responses:
      '201':
        description: Noeud cree, avec le nouveau `lock_version` de la revision
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionNodeWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/nodes/{nodeId}/cost:
  patch:
    tags:
    - projects
    summary: Modifier la facette cout d'un noeud
    description: >-
      Edition partielle : libelle, quantite, debours, role, heures, suivi appro,
      date prevue, code de cout, commentaire. Un champ absent est laisse tel quel ;
      `null` est une valeur. `nature` n'est pas modifiable : en changer
      retournerait tout le jeu d'attributs de la ligne, ce qui est une autre ligne.
      Quel que soit le nombre d'attributs modifies, `lock_version` n'avance que d'un
      cran. Aucune suppression ici : `POST .../nodes/delete` retire le noeud et ses
      deux facettes, et nomme le chiffrage emporte.
    operationId: updateRevisionCostFacet
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    - $ref: ../components/parameters/RevisionNodeId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionCostFacetUpdate.yaml
    responses:
      '200':
        description: Facette mise a jour, avec le nouveau `lock_version`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionWriteRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/export.xlsx:
  get:
    tags:
    - projects
    summary: Exporter le devis d'une revision au format Excel
    description: >-
      Remplace /projects/{projectId}/estimates/{estimateId}/export.xlsx. Meme
      classeur -- feuilles `Devis` et `Agregats`, memes colonnes, memes
      sous-totaux -- mais construit a partir des facettes cout de la revision et
      chiffre en direct : un brouillon exporte donc aussi ses lignes MO, ce que
      la grille historique ne savait faire qu'une fois la validation passee.
      Chaque montant est publie en euros au centime, arrondi ligne a ligne avant
      toute addition, exactement ce que faisaient les colonnes Numeric(16,2) du
      socle remplace. Lecture pure : autorisee quel que soit le statut de la
      revision, et un taux horaire manquant chiffre sa ligne a zero plutot que
      de rendre illisible un brouillon parfaitement editable.
    operationId: exportRevisionExcel
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    responses:
      '200':
        description: Classeur Excel du devis de la revision
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/export-reconciliation.xlsx:
  get:
    tags:
    - projects
    summary: Exporter une revision au format Excel reconciliable
    description: >-
      Remplace
      /projects/{projectId}/estimates/{estimateId}/export-reconciliation.xlsx.
      Trois feuilles (Taches / MO / Non-MO), mais toutes les trois sont des vues
      du meme arbre : chaque ligne porte son `node_id`, son `parent_node_id` et
      sa `position` -- un identifiant la ou le fichier historique en portait deux
      par ligne, et le placement qui rend reconstructible la tache porteuse de
      chaque ligne de cout (INV-01). Les colonnes `bearing_task_node_id` /
      `bearing_task_name` sont informatives : la tache porteuse est une
      consequence du placement, jamais une donnee que la reimportation lit.
      Lecture pure, refusee sur rien : ce qu'une revision validee refuse, c'est
      la reimportation de ce fichier (REVISION_IMMUTABLE).
    operationId: exportRevisionReconciliationExcel
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    responses:
      '200':
        description: Classeur Excel reconciliable (feuilles Taches / MO / Non-MO)
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/import-reconciliation/preview:
  post:
    tags:
    - projects
    summary: Previsualiser la reconciliation d'un classeur Excel dans une revision
    description: >-
      Analyse le fichier reexporte par /export-reconciliation.xlsx, eventuellement
      edite, et calcule le diff (creations / mises a jour / suppressions) sans rien
      ecrire. Execute exactement l'analyse que /confirm execute sur le meme fichier,
      donc l'apercu predit la confirmation au lieu de l'approcher.
      Ne prend aucun verrou et n'est refuse sur aucun statut de revision : montrer
      ce qu'un fichier changerait est sans effet, et refuser l'apercu masquerait la
      raison meme pour laquelle la confirmation va etre refusee. Le refus est celui
      de /confirm, et c'est REVISION_IMMUTABLE.
    operationId: previewRevisionReconciliationImport
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
                description: Classeur Excel reconciliable (voir /export-reconciliation.xlsx)
    responses:
      '200':
        description: Diagnostic de reconciliation (apercu, rien n'est applique)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionReconciliationPlanRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '413':
        $ref: ../components/responses/RevisionPayloadTooLarge.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/import-reconciliation/confirm:
  post:
    tags:
    - projects
    summary: Confirmer la reconciliation d'un classeur Excel dans une revision
    description: >-
      Rejoue exactement l'analyse de /preview sur le fichier resoumis (aucune
      session d'import stockee cote serveur) et l'applique en une seule
      transaction si `blocking_issues` est vide. Ordre d'application :
      suppressions, mises a jour, puis creations -- une creation doit trouver son
      parent vivant, ce que le fichier est refuse s'il ne le garantit pas.
      L'upload, le controle de taille et l'analyse openpyxl ont tous lieu avant
      toute prise de verrou ; seul un precheck sans probleme prend le verrou du
      projet et rejoue la mise en scene sous ce verrou, ce qui ferme la fenetre
      TOCTOU. Si des problemes bloquants sont trouves, rien n'est ecrit et la
      reponse est un 409 portant le `RevisionReconciliationPlanRead` complet
      (`applied=false`), jamais un 2xx trompeur. Une revision `validated` ou
      `superseded` refuse l'ecriture avec REVISION_IMMUTABLE (INV-03), le meme
      code que toute autre ecriture sur l'une ou l'autre facette.
    operationId: confirmRevisionReconciliationImport
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
                description: Le meme classeur Excel que celui soumis a /preview
    responses:
      '200':
        description: Reconciliation appliquee
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionReconciliationPlanRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionReconciliationConfirmConflict.yaml
      '413':
        $ref: ../components/responses/RevisionPayloadTooLarge.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/copy:
  post:
    tags:
    - projects
    summary: Creer un brouillon a partir d'une revision existante
    description: >-
      Copie l'arbre et les deux facettes de la revision source dans un nouveau
      brouillon : chaque noeud de la copie designe le **meme** `work_item` que son
      homologue, aucune identite de noeud n'est partagee, les liens de precedence
      sont retraduits sur les noeuds de la copie (INV-08) et les lignes figees
      d'une source validee ne sont pas copiees -- un brouillon n'en porte aucune
      (INV-24). Quel que soit le statut de la source : copier **est** la seule
      maniere de modifier une revision validee (INV-03), et c'est aussi la maniere
      d'ouvrir une seconde variante de chiffrage -- deux variantes sont deux
      revisions completes, chacune avec son arbre, et editer l'une n'a aucun effet
      sur l'autre. La ligne projet est verrouillee le temps de la requete, ce qui
      serialise l'allocation de `version_number` a l'echelle du projet.
    operationId: copyRevision
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionCopy.yaml
    responses:
      '201':
        description: Brouillon cree, avec son propre `lock_version`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RevisionCreatedRead.yaml
      '400':
        $ref: ../components/responses/RevisionBadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '404':
        $ref: ../components/responses/RevisionNotFound.yaml
      '409':
        $ref: ../components/responses/RevisionConflict.yaml
      '422':
        $ref: ../components/responses/RevisionUnprocessable.yaml
/projects/{projectId}/revisions/{revisionId}/validate:
  post:
    tags:
    - projects
    summary: Valider une revision et figer son document
    description: >-
      La revision passe en `validated`, `validated_at` est horodate, les lignes
      figees sont produites -- une par (chiffrage, annee), portant le taux annuel
      et le coefficient d'inflation sous lesquels elles ont ete chiffrees -- et la
      revision precedemment validee **de meme nature** passe en `superseded`
      (INV-22). A partir de la, toute ecriture sur cette revision est refusee avec
      le meme code `REVISION_IMMUTABLE`, sur la facette planification comme sur la
      facette cout, et la seule maniere de modifier quoi que ce soit est
      `POST .../copy`. Un referentiel de taux incomplet refuse la validation
      (`REVISION_RATE_COVERAGE_MISSING`), et un chiffrage que le moteur ne peut
      rattacher a aucune annee -- une facette de main-d'oeuvre portee par une tache
      sans dates -- la refuse aussi (`REVISION_UNPRICEABLE_FACET`) : les deux
      figeraient un zero a la place d'un prix. La lecture des totaux, elle, tolere
      les deux manques et les signale dans son corps de reponse. La revision validee
      cesse d'etre la revision affichee du projet (`displayed_revision_id` repasse a
      `null`) : cette colonne designe le brouillon en cours de travail, et il n'y en
      a plus. Le pointeur de reference, lui, n'est pas touche -- seule l'entree en
      `en_cours` le fixe.
    operationId: validateRevision
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters/ProjectId.yaml
    - $ref: ../components/parameters/RevisionId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
