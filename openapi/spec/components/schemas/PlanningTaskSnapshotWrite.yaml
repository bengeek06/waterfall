type: object
required:
- uid
- name
properties:
  uid:
    type: integer
    minimum: 1
  id_display:
    type: [integer, "null"]
  structure_key:
    type: [string, "null"]
    maxLength: 128
  structure_kind:
    type: [string, "null"]
    enum:
    - poste
    - lot
    - livrable
    - milestone
    - task
    - null
  parent_uid:
    type: [integer, "null"]
    minimum: 1
  position:
    type: [integer, "null"]
    minimum: 1
  name:
    type: string
    minLength: 1
    maxLength: 512
  outline_number:
    type: [string, "null"]
    maxLength: 512
  outline_level:
    type: [integer, "null"]
  wbs:
    type: [string, "null"]
    maxLength: 255
  start_at:
    type: [string, "null"]
    format: date-time
  finish_at:
    type: [string, "null"]
    format: date-time
  duration_minutes:
    type: [integer, "null"]
    minimum: 0
  duration_format:
    type: [integer, "null"]
  work_minutes:
    type: [integer, "null"]
    minimum: 0
  task_type:
    type: [integer, "null"]
    minimum: 0
    maximum: 2
  percent_complete:
    type: [integer, "null"]
    minimum: 0
    maximum: 100
  is_summary:
    type: boolean
    default: false
  is_milestone:
    type: boolean
    default: false
  is_manual:
    type: [boolean, "null"]
  calendar_uid:
    type: [integer, "null"]
  notes:
    type: [string, "null"]
