type: object
required:
- uid
- id_display
- structure_key
- structure_kind
- parent_uid
- position
- name
- outline_number
- outline_level
- wbs
- start_at
- finish_at
- duration_minutes
- duration_format
- work_minutes
- task_type
- percent_complete
- is_summary
- is_milestone
- is_manual
- calendar_uid
- notes
properties:
  uid:
    type: integer
    minimum: 1
  id_display:
    type: [integer, "null"]
  structure_key:
    type: [string, "null"]
    maxLength: 128
  structure_kind:
    type: [string, "null"]
    enum:
    - poste
    - lot
    - livrable
    - milestone
    - task
    - null
  parent_uid:
    type: [integer, "null"]
    minimum: 1
  position:
    type: [integer, "null"]
    minimum: 1
  name:
    type: string
    minLength: 1
    maxLength: 512
  outline_number:
    type: [string, "null"]
    maxLength: 512
  outline_level:
    type: [integer, "null"]
  wbs:
    type: [string, "null"]
    maxLength: 255
  start_at:
    type: [string, "null"]
    format: date-time
  finish_at:
    type: [string, "null"]
    format: date-time
  duration_minutes:
    type: [integer, "null"]
    minimum: 0
  duration_format:
    type: [integer, "null"]
  work_minutes:
    type: [integer, "null"]
    minimum: 0
  task_type:
    type: [integer, "null"]
    minimum: 0
    maximum: 2
  percent_complete:
    type: [integer, "null"]
    minimum: 0
    maximum: 100
  is_summary:
    type: boolean
  is_milestone:
    type: boolean
  is_manual:
    type: [boolean, "null"]
  calendar_uid:
    type: [integer, "null"]
  notes:
    type: [string, "null"]
