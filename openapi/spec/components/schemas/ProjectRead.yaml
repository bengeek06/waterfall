type: object
required:
- id
- name
- status
- source_version
- save_version_out
- schedule_from_start
properties:
  id:
    type: integer
    minimum: 1
  name:
    type: string
  status:
    type: string
    enum:
    - cree
    - initialise
    - en_reponse_appel_offre
    - perdu
    - en_cours
    - termine
    - abandonne
  code:
    type: [string, "null"]
  short_description:
    type: [string, "null"]
  source_version:
    type: integer
    enum:
    - 2010
    - 2013
    - 2016
  save_version_out:
    type: integer
    enum:
    - 14
    - 15
    - 16
  schedule_from_start:
    type: boolean
  start_date:
    type: [string, "null"]
    format: date-time
  finish_date:
    type: [string, "null"]
    format: date-time
  currency_code:
    type: [string, "null"]
  planning_reference_id:
    type: [integer, "null"]
  displayed_planning_id:
    type: [integer, "null"]
  reference_estimate_id:
    type: [integer, "null"]