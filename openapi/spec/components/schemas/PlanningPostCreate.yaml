type: object
required:
- key
- name
- lots
properties:
  key:
    type: string
    minLength: 1
    maxLength: 40
    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
  name:
    type: string
    minLength: 1
    maxLength: 512
  lots:
    type: array
    minItems: 1
    items:
      $ref: PlanningLotCreate.yaml
