type: object
required:
- id
- code
- name
- weeks_per_year
- is_active
- created_at
- updated_at
properties:
  id:
    type: integer
    minimum: 1
  code:
    type: string
    minLength: 1
    maxLength: 64
  name:
    type: string
    minLength: 1
    maxLength: 255
  weeks_per_year:
    type: integer
    minimum: 1
    maximum: 53
  is_active:
    type: boolean
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  weekdays:
    type: array
    items:
      $ref: CalendarWeekdayRead.yaml
