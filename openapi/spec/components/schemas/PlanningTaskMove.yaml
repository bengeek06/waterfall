type: object
required:
- task_uids
- position
- expected_revision
properties:
  task_uids:
    type: array
    minItems: 1
    items:
      type: integer
      minimum: 1
  target_parent_uid:
    type:
    - integer
    - 'null'
    minimum: 1
  position:
    type: integer
    minimum: 1
  expected_revision:
    type: integer
    minimum: 0
    description: |-
      Revision of the planning this mutation was computed against. Compared to the
      persisted revision under lock; a mismatch returns a 409 PLANNING_REVISION_CONFLICT.