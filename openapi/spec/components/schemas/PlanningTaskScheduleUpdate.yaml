type: object
required:
- is_manual
- expected_revision
properties:
  is_manual:
    type: boolean
  start_at:
    type: [string, "null"]
    format: date-time
  finish_at:
    type: [string, "null"]
    format: date-time
  duration_minutes:
    type: [integer, "null"]
    minimum: 0
    maximum: 7884000
  expected_revision:
    type: integer
    minimum: 0
