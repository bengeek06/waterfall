type: object
required:
- id
- estimate_id
- position
- task_name
- is_milestone
properties:
  id:
    type: integer
    minimum: 1
  estimate_id:
    type: integer
    minimum: 1
  task_id:
    type: [integer, "null"]
    minimum: 1
  parent_task_id:
    type: [integer, "null"]
    minimum: 1
  position:
    type: integer
    minimum: 1
  task_name:
    type: string
  outline_number:
    type: [string, "null"]
  outline_level:
    type: [integer, "null"]
  is_milestone:
    type: boolean
