    type: string
    minLength: 1
    maxLength: 64
  name:
    type: string
    minLength: 1
    maxLength: 255
  weeks_per_year:
    type: integer
    minimum: 1
    maximum: 53
  weekdays:
    type: array
    maxItems: 7
    items:
      $ref: CalendarWeekdayCreate.yaml
