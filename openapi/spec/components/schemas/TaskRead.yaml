type: object
required:
- id
- project_id
- uid
- name
- is_summary
- is_milestone
properties:
  id:
    type: integer
    minimum: 1
  project_id:
    type: integer
    minimum: 1
  uid:
    type: integer
    minimum: 1
  id_display:
    type: [integer, "null"]
  structure_key:
    type: [string, "null"]
  structure_kind:
    type: [string, "null"]
    enum:
    - poste
    - lot
    - livrable
    - milestone
    - task
  parent_uid:
    type: [integer, "null"]
  position:
    type: [integer, "null"]
  name:
    type: string
  outline_number:
    type: [string, "null"]
  outline_level:
    type: [integer, "null"]
  start_at:
    type: [string, "null"]
    format: date-time
  finish_at:
    type: [string, "null"]
    format: date-time
  duration_minutes:
    type: [integer, "null"]
  percent_complete:
    type: [integer, "null"]
  is_summary:
    type: boolean
  is_milestone:
    type: boolean
  is_manual:
    type: [boolean, "null"]
  description:
    type: [string, "null"]
  predecessor_links:
    type: array
    items:
      $ref: TaskLinkRead.yaml
