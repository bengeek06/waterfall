type: object
required:
- id
- project_id
- uid
- row_number
- name
- is_summary
- is_milestone
properties:
  id:
    type: integer
    minimum: 1
  project_id:
    type: integer
    minimum: 1
  uid:
    type: integer
    minimum: 1
  row_number:
    type: integer
    readOnly: true
    description: >-
      Rank of the task in the planning's current display order (flattened
      depth-first walk, siblings sorted the same way as `outline_number`).
      Recomputed on every read, never stored -- it changes whenever the task
      is moved, reparented, or another task is created/deleted ahead of it.
      Read-only: this field cannot be set by clients.
  structure_key:
    type: [string, "null"]
  structure_kind:
    type: [string, "null"]
    enum:
    - poste
    - lot
    - livrable
    - milestone
    - task
    - null
  parent_uid:
    type: [integer, "null"]
  position:
    type: [integer, "null"]
  name:
    type: string
  outline_number:
    type: [string, "null"]
  outline_level:
    type: [integer, "null"]
  wbs:
    type: [string, "null"]
  start_at:
    type: [string, "null"]
    format: date-time
  finish_at:
    type: [string, "null"]
    format: date-time
  duration_minutes:
    type: [integer, "null"]
  duration_format:
    type: [integer, "null"]
  work_minutes:
    type: [integer, "null"]
  task_type:
    type: [integer, "null"]
  percent_complete:
    type: [integer, "null"]
  is_summary:
    type: boolean
  is_milestone:
    type: boolean
  is_manual:
    type: [boolean, "null"]
  calendar_uid:
    type: [integer, "null"]
  description:
    type: [string, "null"]
  predecessor_links:
    type: array
    items:
      $ref: TaskLinkRead.yaml
