type: object
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  code:
    type: string
    maxLength: 64
    nullable: true
  short_description:
    type: string
    maxLength: 500
    nullable: true
  status:
    type: string
    enum:
    - cree
    - initialise
    - en_reponse_appel_offre
    - perdu
    - en_cours
    - termine
    - abandonne
