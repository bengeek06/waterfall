type: object
required:
- id
- estimate_id
- cost_type_id
- cost_category_id
- cost_type_code
- accounting_code
- label
- quantity
- unit_cost
- purchase_cost
- uid
- position
- row_number
properties:
  id:
    type: integer
    minimum: 1
  estimate_id:
    type: integer
    minimum: 1
  task_id:
    type: [integer, "null"]
    minimum: 1
  cost_type_id:
    type: integer
    minimum: 1
  cost_category_id:
    type: integer
    minimum: 1
  cost_code_id:
    type: [integer, "null"]
    minimum: 1
  cost_type_code:
    type: string
  accounting_code:
    type: string
  category_code:
    type: [string, "null"]
  label:
    type: string
  quantity:
    type: number
  unit_cost:
    type: number
  purchase_cost:
    type: number
  supply_status:
    anyOf:
    - $ref: SupplyStatus.yaml
    - type: "null"
  planned_date:
    type: [string, "null"]
    format: date-time
  uid:
    type: integer
    maximum: -1
    description: >-
      This line's own EstimateGridNode uid (E12-07, #289), always negative.
  parent_uid:
    type: [integer, "null"]
    not:
      enum: [0]
    description: >-
      This line's grid-node parent_uid, exposed as-is (E12-09, #291): positif
      = tache de ce devis (`MsTask.id`), negatif = un autre noeud de grille de
      ce devis, absent/null = racine du devis -- meme convention que
      `EstimateGridNodeMove.target_parent_uid`, reutilisable telle quelle dans
      un appel ulterieur a grid-nodes/move.
  position:
    type: integer
    minimum: 1
    description: This line's local sibling position within its grid-node parent.
  row_number:
    type: integer
    minimum: 1
    readOnly: true
    description: >-
      1-based rank of this line in the devis's merged tasks+grid-node tree
      (E12-09, #291), recomputed on every read, never stored.
