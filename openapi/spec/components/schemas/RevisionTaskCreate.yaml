type: object
required:
- expected_lock_version
- name
properties:
  expected_lock_version:
    type: integer
    maximum: 2147483647
    minimum: 0
  name:
    type: string
    maxLength: 512
    minLength: 1
  parent_id:
    anyOf:
    - type: integer
      maximum: 2147483647
      exclusiveMinimum: 0
    - type: 'null'
  position:
    anyOf:
    - type: integer
      maximum: 2147483647
      minimum: 1
    - type: 'null'
  description:
    anyOf:
    - type: string
      maxLength: 10000
    - type: 'null'
  duration_minutes:
    anyOf:
    - type: integer
      maximum: 7884000
      minimum: 0
    - type: 'null'
  is_milestone:
    type: boolean
    default: false
  start_at:
    anyOf:
    - type: string
      format: date-time
    - type: 'null'
  finish_at:
    anyOf:
    - type: string
      format: date-time
    - type: 'null'
  calendar_id:
    anyOf:
    - type: integer
      maximum: 2147483647
      exclusiveMinimum: 0
    - type: 'null'
description: >-
  Creation d'un noeud tache : un nouveau `work_item` de nature `task` et sa
  facette planification. `parent_id` absent = a la racine, `position` absente =
  dernier enfant. Le calendrier suit la Regle 1 : sans `calendar_id` c'est celui
  du projet, herite et non epingle (`calendar_source` = `project`) ; avec, il est
  epingle (`calendar_source` = `manual`).
