type: object
required:
- kind
- currency_code
properties:
  kind:
    type: string
    enum:
    - initial
    - contract_reference
    - forecast_remaining
  currency_code:
    type: string
    minLength: 3
    maxLength: 3
  reference_estimate_id:
    type: integer
    minimum: 1
    nullable: true
  note:
    type: string
    maxLength: 10000
    nullable: true
