type: object
required:
- kind
- currency_code
properties:
  kind:
    type: string
    enum:
    - initial
    - contract_reference
    - forecast_remaining
  currency_code:
    type: string
    minLength: 3
    maxLength: 3
  reference_estimate_id:
    type: [integer, "null"]
    minimum: 1
  note:
    type: [string, "null"]
    maxLength: 10000
