type: object
required:
- cost_category_id
- label
- quantity
- unit_cost
properties:
  task_id:
    type: [integer, "null"]
    minimum: 1
  cost_category_id:
    type: integer
    minimum: 1
  cost_code_id:
    type: [integer, "null"]
    minimum: 1
  label:
    type: string
    minLength: 1
    maxLength: 512
  quantity:
    type: number
    exclusiveMinimum: 0
  unit_cost:
    type: number
    minimum: 0
  supply_status:
    anyOf:
    - $ref: SupplyStatus.yaml
    - type: "null"
  planned_date:
    type: [string, "null"]
    format: date-time
  target_parent_uid:
    type: [integer, "null"]
    not:
      enum: [0]
    description: |-
      Position de la nouvelle ligne dans l'arbre du devis (E12-07/#289) :
      positif = tache de ce devis (`EstimateTaskRow`), negatif = un autre
      noeud de grille de ce devis, absent/null = racine du devis. Independant
      de `task_id`.
  insert_after_uid:
    type: [integer, "null"]
    maximum: -1
    description: |-
      Noeud de grille frere apres lequel inserer la nouvelle ligne ; absent =
      dernier enfant du parent resolu.
