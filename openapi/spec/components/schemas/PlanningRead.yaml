type: object
required:
- id
- project_id
- version_number
- status
- revision
- created_at
properties:
  id:
    type: integer
    minimum: 1
  project_id:
    type: integer
    minimum: 1
  version_number:
    type: integer
    minimum: 1
  status:
    type: string
    enum:
    - draft
    - validated
    - superseded
  revision:
    type: integer
    minimum: 0
  note:
    type: [string, "null"]
  created_at:
    type: string
    format: date-time
  validated_at:
    type: [string, "null"]
    format: date-time
