type: object
properties:
  code:
    type: string
    minLength: 1
    maxLength: 64
  name:
    type: string
    minLength: 1
    maxLength: 255
  weeks_per_year:
    type: integer
    minimum: 1
    maximum: 53
  is_active:
    type: boolean
  is_default:
    type: boolean
    nullable: true
    description: >-
      Promote this calendar as the system-wide default (must already be active,
      or be activated in the same request). Setting this to false on the
      current default is rejected -- promote another calendar instead.
  weekdays:
    type: array
    maxItems: 7
    description: Remplace integralement les jours de semaine du calendrier
    items:
      $ref: CalendarWeekdayCreate.yaml
