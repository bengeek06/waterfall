type: object
required:
- node_uids
- position
- expected_revision
properties:
  node_uids:
    type: array
    minItems: 1
    items:
      type: integer
      maximum: -1
  target_parent_uid:
    type: [integer, "null"]
    not:
      enum: [0]
    description: |-
      Positif = tache de ce devis (`EstimateTaskRow`), negatif = un autre
      noeud de grille de ce devis, absent/null = racine du devis.
  position:
    type: integer
    minimum: 1
  expected_revision:
    type: integer
    minimum: 0
    description: |-
      Revision du devis sur laquelle cette mutation a ete calculee. Comparee a
      la revision persistee ; un ecart renvoie un 409 ESTIMATE_REVISION_CONFLICT.
