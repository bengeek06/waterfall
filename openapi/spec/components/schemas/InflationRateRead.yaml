type: object
required:
- id
- year
- coefficient
- created_at
- updated_at
properties:
  id:
    type: integer
    minimum: 1
  year:
    type: integer
    minimum: 2000
    maximum: 9999
  coefficient:
    type: number
    exclusiveMinimum: 0
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
