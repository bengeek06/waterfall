type: object
required:
- expected_lock_version
- predecessors
properties:
  expected_lock_version:
    type: integer
    maximum: 2147483647
    minimum: 0
  predecessors:
    items:
      $ref: RevisionPredecessorWrite.yaml
    type: array
    maxItems: 1000
description: >-
  Remplace l'integralite des predecesseurs d'un noeud. Une liste vide les efface,
  et c'est la seule facon de le faire. Bornee a 1000 entrees : la detection de
  cycle parcourt l'ensemble candidat une fois par lien fourni.
