type: object
required:
- task_id
- role_id
- quantity
- hours
properties:
  task_id:
    type: integer
    minimum: 1
  role_id:
    type: integer
    minimum: 1
  cost_code_id:
    type: [integer, "null"]
    minimum: 1
  quantity:
    type: number
    exclusiveMinimum: 0
  hours:
    type: number
    minimum: 0
  comment:
    type: [string, "null"]
    maxLength: 10000
