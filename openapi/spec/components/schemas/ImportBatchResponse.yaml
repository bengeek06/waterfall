type: object
required:
- id
- importMode
- status
- createdAt
- updatedAt
properties:
  id:
    type: integer
    minimum: 1
  importMode:
    $ref: ImportMode.yaml
  status:
    $ref: BatchStatus.yaml
  sourceName:
    type: [string, "null"]
  sourceVersion:
    $ref: SourceVersion.yaml
  startedAt:
    type: [string, "null"]
    format: date-time
  endedAt:
    type: [string, "null"]
    format: date-time
  errorMessage:
    type: [string, "null"]
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
