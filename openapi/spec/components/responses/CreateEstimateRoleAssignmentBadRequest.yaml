description: >-
  Requete invalide -- soit `task_id` ne correspond a aucune tache du projet,
  soit le role ne correspond pas a une categorie de cout main-d'oeuvre active
  (detail generique FastAPIErrorResponse), soit la tache est deja datee
  (start_at et finish_at renseignes) et au moins une (categorie de cout,
  annee) qu'elle couvre n'a pas de CostRate/InflationRate
  (detail.code=MISSING_RATE_COVERAGE, E6-11, #175).
content:
  application/json:
    schema:
      oneOf:
      - $ref: ../schemas/MissingRateCoverage.yaml
      - $ref: ../schemas/FastAPIErrorResponse.yaml
