description: >-
  Suppression en cascade non confirmee (detail.code=CASCADE_CONFIRMATION_REQUIRED,
  avec la liste des uid descendants dans detail.descendant_uids), ou tache
  referencee par un devis, une affectation ou une charge
  (detail.code=TASK_REFERENCED, avec la liste des uid references dans
  detail.task_uids). D'autres conflits (planning non brouillon, conflit
  d'integrite sur la hierarchie) renvoient le detail texte brut generique
  FastAPI plutot que ce detail structure.
content:
  application/json:
    schema:
      oneOf:
      - $ref: ../schemas/PlanningTaskDeleteConflict.yaml
      - $ref: ../schemas/FastAPIErrorResponse.yaml
