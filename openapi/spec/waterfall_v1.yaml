openapi: 3.1.0
info:
  title: Waterfall API
  version: 0.1.0
  summary: Contrat API pour l'import MS Project et la gestion des ressources
  description: 'Contrat OpenAPI du backend Waterfall.

    Le périmètre couvre l''import MS Project, l''enrichissement des tâches,

    l''export XML et le référentiel des ressources, rôles, coûts et capacités.

    '
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: auth
  description: Authentification par bearer token et gestion des utilisateurs
- name: health
  description: Sondes de disponibilité et de préparation
- name: observability
  description: Endpoint de métriques Prometheus
- name: imports-v1
  description: Flux d'import XML MS Project (MVP taches + dependances)
- name: projects
  description: Lecture projets/taches, enrichissement description, export XML
- name: resources
  description: Referentiel des ressources, roles, couts, inflation et capacites
