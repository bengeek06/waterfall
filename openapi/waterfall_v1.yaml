components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique wf_import_batch.id
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique ms_project.id
    TaskUid:
      name: taskUid
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: UID fonctionnel de la tache dans un projet
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique de l'affectation de rôle
    EstimateId:
      name: estimateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique de la version de devis
    CostLineId:
      name: costLineId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique de la ligne de coût du devis
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique du noeud de ressources
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
