      description: Identifiant technique de la categorie de cout
    CostTypeId:
      name: costTypeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique du type de coût
    RateId:
      name: rateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique du taux horaire
    CapacityId:
      name: capacityId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique de la capacite
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
      description: Annee civile
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique de l'utilisateur
    Limit:
      name: limit
      in: query
      required: false
      description: 'Nombre maximum de lignes renvoyees. Absent, l''endpoint renvoie l''integralite des lignes du jeu filtre (voir PaginationMeta.yaml) : il n''y a pas de valeur par defaut qui tronquerait silencieusement une liste.'
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      required: false
      description: 'Nombre de lignes a sauter avant le debut de la page. Requiert `limit` : fourni sans `limit`, il serait sous-specifie (voir la note "Regle offset/limit" dans PaginationMeta.yaml) et est donc rejete avec la reponse BadRequest.yaml.'
      schema:
        type: integer
        minimum: 0
        default: 0
    Search:
      name: q
      in: query
      required: false
      description: Recherche plein texte simple (sous-chaine, insensible a la casse), sur le sous-ensemble de colonnes documente par chaque ressource dans la description de ce parametre au niveau de l'operation. A distinguer des filtres structures deja existants sur certaines ressources (`include_inactive`, `node_id`, `role_id`, ...), qui restent des parametres dedies et se combinent avec `q`.
      schema:
        type: string
        minLength: 1
    CostCodeId:
      name: costCodeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identifiant technique du code d'imputation du projet
  responses:
    BadRequest:
      description: Requete invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    Forbidden:
      description: Droits administrateur requis
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    Conflict:
      description: Conflit avec une valeur existante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    BatchNotFound:
      description: Batch introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ProjectNotFound:
      description: Projet introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    PlanningNotFound:
      description: Planning introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ProjectPlanningTaskNotFound:
      description: Projet, planning ou tache introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    MovePlanningTasksBadRequest:
      description: Requete de deplacement invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    MovePlanningTasksNotFound:
      description: Projet, planning ou tache introuvable pendant le deplacement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    MovePlanningTasksConflict:
      description: |-
        Le deplacement entre en conflit avec le planning, ou `expected_revision` ne
        correspond plus a la revision persistee (code `PLANNING_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    CreatePlanningTaskBadRequest:
      description: Requete de creation invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    CreatePlanningTaskNotFound:
      description: Projet, planning ou tache parent introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    CreatePlanningTaskConflict:
      description: |-
        La creation entre en conflit avec le planning, ou `expected_revision` ne
        correspond plus a la revision persistee (code `PLANNING_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    DeletePlanningTasksBadRequest:
      description: Requete de suppression invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    DeletePlanningTasksNotFound:
      description: Projet, planning ou tache introuvable pendant la suppression
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    DeletePlanningTasksConflict:
      description: Suppression en cascade non confirmee (detail.code=CASCADE_CONFIRMATION_REQUIRED, avec la liste des uid descendants dans detail.descendant_uids), ou tache referencee par un devis, une affectation ou une charge (detail.code=TASK_REFERENCED, avec la liste des uid references dans detail.task_uids). D'autres conflits (planning non brouillon, conflit d'integrite sur la hierarchie, `expected_revision` obsolete avec detail.code=PLANNING_REVISION_CONFLICT) renvoient le detail generique FastAPI plutot que ce detail structure.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/PlanningTaskDeleteConflict'
              - $ref: '#/components/schemas/FastAPIErrorResponse'
    EstimateNotFound:
      description: Devis introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    TaskNotFound:
      description: Tache introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ResourceNotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    UserNotFound:
      description: Utilisateur introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    UpdatePlanningTaskScheduleBadRequest:
      description: Combinaison mode/dates/duree invalide pour la tache
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    UpdatePlanningTaskScheduleNotFound:
      description: Projet, planning ou tache introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    UpdatePlanningTaskScheduleConflict:
      description: |-
        La mise a jour du planning entre en conflit avec les donnees, ou `expected_revision`
        ne correspond plus a la revision persistee (code `PLANNING_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ReplaceTaskLinksBadRequest:
      description: Requete de mise a jour des liens invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ReplaceTaskLinksNotFound:
      description: Projet, planning ou tache introuvable pendant la mise a jour des liens
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ReplaceTaskLinksConflict:
      description: |-
        La mise a jour des liens entre en conflit avec le planning, ou `expected_revision`
        ne correspond plus a la revision persistee (code `PLANNING_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    RestorePlanningSnapshotBadRequest:
      description: Snapshot de restauration invalide (uid/cle dupliques, lien inconnu)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    RestorePlanningSnapshotNotFound:
      description: Projet ou planning introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    RestorePlanningSnapshotConflict:
      description: Le snapshot entre en conflit avec le planning (cycle, parent orphelin, milestone avec enfants), ou `expected_revision` ne correspond plus a la revision persistee (code `PLANNING_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ReopenPlanningStructureConflict:
      description: Soit la reference de planning n'est pas validee, elle ne peut donc pas servir de base a la reouverture de la structure (code `PLANNING_STRUCTURE_REOPEN_REQUIRES_VALIDATION`), soit la reouverture entre en conflit avec les donnees existantes lors de l'enregistrement (code `PLANNING_STRUCTURE_REOPEN_INTEGRITY_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    CreateEstimateRoleAssignmentBadRequest:
      description: 'Requete invalide -- soit `task_id` ne correspond a aucune tache du projet, soit le role ne correspond pas a une categorie de cout main-d''oeuvre active (detail generique FastAPIErrorResponse), soit la tache est deja datee (start_at et finish_at renseignes) et au moins une (categorie de cout, annee) qu''elle couvre n''a pas de CostRate/InflationRate (detail.code=MISSING_RATE_COVERAGE, E6-11, #175).'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingRateCoverage'
              - $ref: '#/components/schemas/FastAPIErrorResponse'
    ValidateProjectEstimateConflict:
      description: 'Le devis n''est pas un brouillon (detail generique FastAPIErrorResponse), ou au moins une (categorie de cout, annee) couverte par une affectation de main-d''oeuvre n''a pas de CostRate/InflationRate (detail.code= MISSING_RATE_COVERAGE, E6-11, #175) -- dans ce dernier cas, aucune EstimateLine n''est generee ni persistee et le devis reste un brouillon.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingRateCoverage'
              - $ref: '#/components/schemas/FastAPIErrorResponse'
    EstimateReconciliationConfirmConflict:
      description: Soit des problemes bloquants ont ete trouves et rien n'a ete applique -- le corps est alors le `ReconciliationPlanRead` complet (pas l'enveloppe `FastAPIErrorResponse` habituelle), avec `applied=false` ; soit le precheck (execute hors verrou) n'a rien trouve mais une ecriture concurrente a fait echouer la suppression de tache reelle une fois le verrou pris, auquel cas le corps est un `PlanningTaskDeleteConflict` (detail.code=CASCADE_CONFIRMATION_REQUIRED/TASK_REFERENCED), exactement comme la suppression directe de taches du planning (`DeletePlanningTasksConflict`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ReconciliationPlanRead'
              - $ref: '#/components/schemas/PlanningTaskDeleteConflict'
