    PlanningNotFound:
      description: Planning introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    RevisionBadRequest:
      description: 'Requete refusee par le domaine de revision : selection vide ou incoherente, position hors plage, deplacement circulaire, tache placee sous une ligne de cout, noeud place sous un jalon, lien de precedence invalide, ou predecesseur n''appartenant pas a cette revision. `detail.code` porte le code stable (REVISION_SELECTION_INVALID, REVISION_POSITION_INVALID, REVISION_TREE_CYCLE, REVISION_FACET_PLACEMENT_INVALID, REVISION_MILESTONE_HAS_CHILDREN, REVISION_LINK_INVALID, REVISION_CROSS_REVISION, REVISION_FACET_CONTRACT, REVISION_PROJECT_MISMATCH, REVISION_WORK_BREAKDOWN_INVALID, REVISION_IMPORT_STRUCTURE_INVALID, REVISION_REFUSED). REVISION_MILESTONE_HAS_CHILDREN est le refus d''INV-27 : un jalon ne porte aucun enfant, ni sous-tache ni ligne de cout, et la regle se lit dans les deux sens -- on ne rattache rien sous un jalon, et on ne marque pas comme jalon une tache qui porte deja des enfants. REVISION_CROSS_REVISION signifie « cet identifiant de noeud n''est pas un des notres » : il couvre aussi bien un noeud d''une autre revision qu''un identifiant qui ne designe aucun noeud, distinction que cette revision ne peut pas faire et ne pretend pas faire.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionErrorResponse'
    RevisionNotFound:
      description: Projet, revision ou noeud introuvable. `detail.code` vaut PROJECT_NOT_FOUND quand le projet n'existe pas ou n'appartient pas a l'appelant (meme reponse dans les deux cas, volontairement), REVISION_NOT_FOUND quand la revision n'existe pas (ou n'appartient pas au projet) et REVISION_NODE_NOT_FOUND quand le noeud, l'element de travail ou la facette visee n'existe pas dans cette revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionErrorResponse'
    RevisionConflict:
      description: 'Ecriture refusee sur l''etat stocke. Deux codes principaux : REVISION_LOCK_CONFLICT quand `expected_lock_version` est perime (le corps porte alors `revision_id`, `expected_lock_version` et `current_lock_version`, et rien n''a ete modifie), et REVISION_IMMUTABLE quand la revision est `validated` ou `superseded` et refuse toute ecriture (INV-03) -- code identique sur la facette planification et sur la facette cout. Egalement PROJECT_READ_ONLY quand le statut du projet est `perdu`, `termine` ou `abandonne` (distinct d''INV-03 : la revision visee peut etre un brouillon parfaitement editable), PROJECT_CALENDAR_MISSING, REVISION_DUPLICATE_WORK_ITEM, REVISION_EXTERNAL_UID_CONFLICT, REVISION_LIFECYCLE_CONFLICT, REVISION_WRITE_REFUSED et REVISION_INTEGRITY_CONFLICT.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionLockConflict'
    RevisionUnprocessable:
      description: 'Corps de requete invalide au sens du schema : selection vide, entier hors des bornes de sa colonne, code MSPDI hors enumeration, `null` explicite sur un champ qui n''a pas d''etat « vide » (`name`, `percent_complete`, `is_milestone`, `is_manual` de la facette planification), ou `target_parent_id`/`position` fournis avec un `mode` qui calcule lui-meme sa destination. Rien n''a ete ecrit et `lock_version` n''a pas bouge.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionValidationError'
    ProjectPlanningTaskNotFound:
      description: Projet, planning ou tache introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    EstimateNotFound:
      description: Devis introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    TaskNotFound:
      description: Tache introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ResourceNotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    UserNotFound:
      description: Utilisateur introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ReopenPlanningStructureConflict:
      description: Soit la reference de planning n'est pas validee, elle ne peut donc pas servir de base a la reouverture de la structure (code `PLANNING_STRUCTURE_REOPEN_REQUIRES_VALIDATION`), soit la reouverture entre en conflit avec les donnees existantes lors de l'enregistrement (code `PLANNING_STRUCTURE_REOPEN_INTEGRITY_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    CreateEstimateRoleAssignmentBadRequest:
      description: 'Requete invalide -- soit `task_id` ne correspond a aucune tache du projet, soit le role ne correspond pas a une categorie de cout main-d''oeuvre active (detail generique FastAPIErrorResponse), soit la tache est deja datee (start_at et finish_at renseignes) et au moins une (categorie de cout, annee) qu''elle couvre n''a pas de CostRate/InflationRate (detail.code=MISSING_RATE_COVERAGE, E6-11, #175).'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingRateCoverage'
              - $ref: '#/components/schemas/FastAPIErrorResponse'
    MoveEstimateGridNodesBadRequest:
      description: Requete de deplacement invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    MoveEstimateGridNodesNotFound:
      description: Projet, devis, tache ou noeud introuvable pendant le deplacement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    MoveEstimateGridNodesConflict:
      description: |-
        Le deplacement entre en conflit avec l'arbre du devis, ou `expected_revision`
        ne correspond plus a la revision persistee (code `ESTIMATE_REVISION_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastAPIErrorResponse'
    ValidateProjectEstimateConflict:
      description: 'Le devis n''est pas un brouillon (detail generique FastAPIErrorResponse), ou au moins une (categorie de cout, annee) couverte par une affectation de main-d''oeuvre n''a pas de CostRate/InflationRate (detail.code= MISSING_RATE_COVERAGE, E6-11, #175) -- dans ce dernier cas, aucune EstimateLine n''est generee ni persistee et le devis reste un brouillon.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingRateCoverage'
              - $ref: '#/components/schemas/FastAPIErrorResponse'
    EstimateReconciliationConfirmConflict:
      description: Soit des problemes bloquants ont ete trouves et rien n'a ete applique -- le corps est alors le `ReconciliationPlanRead` complet (pas l'enveloppe `FastAPIErrorResponse` habituelle), avec `applied=false` ; soit le precheck (execute hors verrou) n'a rien trouve mais une ecriture concurrente a fait echouer la suppression de tache reelle une fois le verrou pris, auquel cas le corps est un `PlanningTaskDeleteConflict` (detail.code=CASCADE_CONFIRMATION_REQUIRED/TASK_REFERENCED), exactement comme la suppression directe de taches du planning (`DeletePlanningTasksConflict`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ReconciliationPlanRead'
              - $ref: '#/components/schemas/PlanningTaskDeleteConflict'
