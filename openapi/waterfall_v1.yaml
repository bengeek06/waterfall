openapi: 3.1.0
info:
  title: Waterfall API
  version: 0.1.0
  summary: Contrat API pour l'import MS Project et la gestion des ressources
  description: |
    Contrat OpenAPI du backend Waterfall.
    Le périmètre couvre l'import MS Project, l'enrichissement des tâches,
    l'export XML et le référentiel des ressources, rôles, coûts et capacités.
servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: auth
    description: Authentification par bearer token et gestion des utilisateurs
  - name: health
    description: Sondes de disponibilité et de préparation
  - name: observability
    description: Endpoint de métriques Prometheus
  - name: imports-v1
    description: Flux d'import XML MS Project (MVP taches + dependances)
  - name: projects
    description: Lecture projets/taches, enrichissement description, export XML
  - name: resources
    description: Referentiel des ressources, roles, couts, inflation et capacites

paths:
  /health:
    get:
      tags: [health]
      summary: Vérifier la disponibilité de l'API
      operationId: getHealth
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    get:
      tags: [health]
      summary: Vérifier que l'API est prête
      operationId: getReadiness
      responses:
        '200':
          description: API prête
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /metrics:
    get:
      tags: [observability]
      summary: Exposer les métriques Prometheus
      operationId: getMetrics
      responses:
        '200':
          description: Métriques Prometheus
          content:
            text/plain:
              schema:
                type: string

  /auth/register:
    post:
      tags: [auth]
      summary: Créer un utilisateur public lorsque l'inscription est activée
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/token:
    post:
      tags: [auth]
      summary: Obtenir un access token et définir le cookie de refresh HttpOnly
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentification réussie; le refresh token est défini par cookie HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: Compte temporairement verrouillé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de tentatives de connexion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renouveler l'access token depuis le cookie de refresh HttpOnly
      operationId: refreshAccessToken
      responses:
        '200':
          description: Access token renouvelé et cookie de refresh renouvelé
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [auth]
      summary: Effacer le cookie de refresh
      operationId: logout
      responses:
        '204':
          description: Session de refresh effacée

  /auth/me:
    get:
      tags: [auth]
      summary: Lire l'utilisateur courant
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me/password:
    post:
      tags: [auth]
      summary: Modifier le mot de passe de l'utilisateur courant
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Mot de passe modifié
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/users:
    get:
      tags: [auth]
      summary: Lister les utilisateurs
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAdminRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [auth]
      summary: Créer un utilisateur administrativement
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/users/{userId}:
    delete:
      tags: [auth]
      summary: Supprimer un utilisateur
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Utilisateur supprimé
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /auth/users/{userId}/status:
    patch:
      tags: [auth]
      summary: Activer ou désactiver un utilisateur
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /auth/users/{userId}/role:
    patch:
      tags: [auth]
      summary: Modifier le rôle administrateur d'un utilisateur
      operationId: updateUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /imports/v1/batches:
    post:
      tags: [imports-v1]
      summary: Creer un batch d'import
      operationId: createImportBatchV1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
      responses:
        '201':
          description: Batch cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /imports/v1/batches/{batchId}/xml:
    post:
      tags: [imports-v1]
      summary: Uploader le fichier XML MS Project
      operationId: uploadImportSourceXmlV1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier .xml source MS Project
      responses:
        '202':
          description: XML recu et associe au batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BatchNotFound'
        '415':
          description: Media type non supporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fichier XML trop volumineux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /imports/v1/batches/{batchId}/run:
    post:
      tags: [imports-v1]
      summary: Executer l'import V1 (taches + dependances)
      operationId: runImportBatchV1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRunRequest'
      responses:
        '202':
          description: Import lance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BatchNotFound'
        '409':
          description: Etat du batch incompatible avec l'operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /imports/v1/batches/{batchId}/diff:
    get:
      tags: [imports-v1]
      summary: Previsualiser les changements d'un import
      operationId: getImportBatchDiffV1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Diff d'import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDiffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BatchNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /imports/v1/batches/{batchId}:
    get:
      tags: [imports-v1]
      summary: Lire le statut du batch
      operationId: getImportBatchV1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Statut du batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BatchNotFound'

  /imports/v1/batches/{batchId}/errors:
    get:
      tags: [imports-v1]
      summary: Lister les erreurs d'import
      operationId: listImportBatchErrorsV1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Liste paginee des erreurs d'import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportErrorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BatchNotFound'

  /projects:
    get:
      tags: [projects]
      summary: Lister les projets importes
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Liste de projets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [projects]
      summary: Creer un projet sans import
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Projet cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRead'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}:
    get:
      tags: [projects]
      summary: Lire un projet
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      tags: [projects]
      summary: Renommer un projet
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Projet modifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    delete:
      tags: [projects]
      summary: Supprimer un projet
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Projet supprime
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /projects/{projectId}/tasks:
    get:
      tags: [projects]
      summary: Lister les taches d'un projet
      operationId: listProjectTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Liste de taches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      tags: [projects]
      summary: Ajouter une tache de planning au projet
      operationId: createProjectTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Tache creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /projects/{projectId}/planning-structure:
    post:
      tags: [projects]
      summary: Generer le squelette de planning depuis une structure metier
      operationId: createPlanningStructure
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningStructureCreate'
      responses:
        '201':
          description: Squelette de planning genere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningStructureRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/planning-tree:
    get:
      tags: [projects]
      summary: Lire l'arbre hiérarchique du planning
      operationId: getPlanningTree
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Arbre hiérarchique du planning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTreeRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /projects/{projectId}/tasks/{taskUid}:
    patch:
      tags: [projects]
      summary: Mettre a jour la description d'une tache
      operationId: updateTaskDescription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDescriptionUpdate'
      responses:
        '200':
          description: Tache mise a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    delete:
      tags: [projects]
      summary: Supprimer une tache de planning sans enfant ni usage dans un devis
      operationId: deleteProjectTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
      responses:
        '204':
          description: Tache supprimee
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/tasks/{taskUid}/role-assignments:
    get:
      tags: [projects]
      summary: Lister les affectations de main-d'œuvre d'une tâche
      operationId: listTaskRoleAssignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
      responses:
        '200':
          description: Affectations de rôles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRoleAssignmentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    post:
      tags: [projects]
      summary: Affecter un rôle de main-d'œuvre à une tâche
      operationId: createTaskRoleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRoleAssignmentCreate'
      responses:
        '201':
          description: Affectation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRoleAssignmentRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/tasks/{taskUid}/role-assignments/{assignmentId}:
    patch:
      tags: [projects]
      summary: Modifier une affectation de rôle
      operationId: updateTaskRoleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRoleAssignmentUpdate'
      responses:
        '200':
          description: Affectation modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRoleAssignmentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    delete:
      tags: [projects]
      summary: Supprimer une affectation de rôle
      operationId: deleteTaskRoleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskUid'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '204':
          description: Affectation supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /projects/{projectId}/estimates:
    get:
      tags: [projects]
      summary: Lister les versions de devis d'un projet
      operationId: listProjectEstimates
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Versions de devis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectEstimateRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      tags: [projects]
      summary: Créer un brouillon de devis et son snapshot de tâches
      operationId: createProjectEstimate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectEstimateCreate'
      responses:
        '201':
          description: Brouillon de devis créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEstimateRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
