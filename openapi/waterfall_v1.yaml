components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadinessStatus:
      type: object
      description: 'État de préparation de l''API. Le corps est identique en 200 et en 503 : seul le code HTTP change, `checks` indique toujours quelle dépendance est en cause.'
      required:
        - status
        - checks
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
          example: ready
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
        timestamp:
          type: string
          format: date-time
    ReadinessChecks:
      type: object
      description: 'Résultat par dépendance. Volontairement binaire (`ok`/`unavailable`) et sans message : `/health/ready` n''est pas authentifié, le détail de la panne reste dans les logs de l''API.'
      required:
        - database
        - redis
        - storage
      properties:
        database:
          type: string
          enum:
            - ok
            - unavailable
          example: ok
        redis:
          type: string
          enum:
            - ok
            - unavailable
          example: ok
        storage:
          type: string
          enum:
            - ok
            - unavailable
          example: ok
    UserCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    UserRead:
      type: object
      required:
        - id
        - email
        - is_active
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        is_active:
          type: boolean
    UserAdminRead:
      allOf:
        - $ref: '#/components/schemas/UserRead'
        - type: object
          required:
            - is_admin
            - failed_login_attempts
            - created_at
            - updated_at
          properties:
            is_admin:
              type: boolean
            failed_login_attempts:
              type: integer
              minimum: 0
            locked_until:
              type:
                - string
                - 'null'
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    UserStatusUpdate:
      type: object
      required:
        - is_active
      properties:
        is_active:
          type: boolean
    UserRoleUpdate:
      type: object
      required:
        - is_admin
      properties:
        is_admin:
          type: boolean
    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    Token:
      type: object
      required:
        - access_token
        - token_type
        - expiresIn
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        expiresIn:
          type: integer
          minimum: 1
    ImportMode:
      type: string
      enum:
        - standard
        - full
      description: |
        standard: importe uniquement ms_task et ms_task_link.
        full: reserve a une phase ulterieure (ressources/affectations).
    BatchStatus:
      type: string
      enum:
        - pending
        - running
        - success
        - failed
    SourceVersion:
      type: integer
      enum:
        - 2010
        - 2013
        - 2016
      description: Version source detectee/annoncee du XML MS Project
    ImportBatchCreateRequest:
      type: object
      required:
        - projectId
        - importMode
      properties:
        projectId:
          type: integer
          minimum: 1
          description: Projet cible, appartenant à l'utilisateur authentifié
        importMode:
          $ref: '#/components/schemas/ImportMode'
        sourceName:
          type: string
          maxLength: 255
          description: Nom logique de la source ou du planning
    ImportBatchResponse:
      type: object
      required:
        - id
        - importMode
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
        importMode:
          $ref: '#/components/schemas/ImportMode'
        status:
          $ref: '#/components/schemas/BatchStatus'
        sourceName:
          type:
            - string
            - 'null'
        sourceVersion:
          $ref: '#/components/schemas/SourceVersion'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        endedAt:
          type:
            - string
            - 'null'
          format: date-time
        errorMessage:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ImportRunRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
          description: Valide le fichier sans persister en base (optionnel)
        confirm:
          type: boolean
          default: false
          description: Confirme l'application du diff
    ImportDiffItem:
      type: object
      required:
        - kind
        - uid
        - message
        - fields
        - costLosses
      properties:
        kind:
          type: string
          enum:
            - added
            - modified
            - removed
            - calendar_mismatch
        uid:
          type: integer
          minimum: 1
        message:
          type: string
        fields:
          type: array
          items:
            type: string
        linkChanges:
          type: array
          items:
            $ref: '#/components/schemas/ImportLinkChange'
        calendarMismatch:
          anyOf:
            - $ref: '#/components/schemas/ImportCalendarMismatch'
            - type: 'null'
        costLosses:
          type: array
          items:
            $ref: '#/components/schemas/ImportCostLoss'
      description: 'Un element de la previsualisation d''import. Cas particulier des elements "removed" : les pertes de chiffrage sont calculees sur la revision et les suppressions sur le planning de l''ancien socle actuellement affiche, deux sources qu''un utilisateur peut desynchroniser (reafficher un planning anterieur a celui qu''a cree le dernier import). Une perte dont l''uid n''existe pas dans le planning affiche recoit alors un element "removed" synthetise plutot que d''etre jetee, car la jeter sous-estimerait silencieusement la somme en jeu (Regle 3). Un tel element compte et se somme comme n''importe quel "removed", mais il n''a par construction aucune ligne correspondante dans le planning affiche : son uid n''y existe pas, donc une jointure sur uid pour en recuperer le libelle ne rend rien. Un client qui affiche le nom de la tache doit se rabattre sur le message de l''element.'
    ImportLinkChange:
      type: object
      required:
        - action
        - taskUid
        - predecessorUid
        - linkType
      properties:
        action:
          type: string
          enum:
            - added
            - removed
        taskUid:
          type: integer
        predecessorUid:
          type: integer
        linkType:
          type: integer
        lagTenthMinute:
          type:
            - integer
            - 'null'
        lagFormat:
          type:
            - integer
            - 'null'
    ImportDiffResponse:
      type: object
      required:
        - batchId
        - identicalSource
        - items
        - costLosses
      properties:
        batchId:
          type: integer
          minimum: 1
        sourceSha256:
          type:
            - string
            - 'null'
        identicalSource:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportDiffItem'
        costLosses:
          type: array
          description: 'Total dedoublonne du chiffrage que la confirmation de cet import detruirait (Regle 3). C''est le seul montant sommable : les listes costLosses portees par chaque item de diff attribuent la meme perte a chaque tache disparue qui l''emporte, donc un noeud de cout condamne par deux suppressions imbriquees y figure deux fois.'
          items:
            $ref: '#/components/schemas/ImportCostLoss'
      description: 'Previsualisation d''un import, avec le garde-fou de la Regle 3 sous ses deux formes : attribue par tache disparue sur chaque item, et totalise ici.'
    ImportRunAcceptedResponse:
      type: object
      required:
        - batchId
        - status
        - acceptedAt
        - revisionId
        - revisionCreated
      properties:
        batchId:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/BatchStatus'
        acceptedAt:
          type: string
          format: date-time
        revisionId:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 'Revision dans laquelle le fichier a ete importe. L''import vise toujours la derniere revision du projet par numero de version et le client ne la choisit pas : sans cette information, un utilisateur qui croit alimenter un brouillon alors qu''un plus recent existe ne l''apprendrait jamais. null sur un dry run, qui n''ecrit rien.'
        revisionCreated:
          type:
            - boolean
            - 'null'
          description: true quand l'import a cree la revision designee par revisionId (le projet n'en avait aucune), false quand il a reimporte dans une revision existante. null sur un dry run.
