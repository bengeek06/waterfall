components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadinessStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: ready
        timestamp:
          type: string
          format: date-time
    UserCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    UserRead:
      type: object
      required:
        - id
        - email
        - is_active
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        is_active:
          type: boolean
    UserAdminRead:
      allOf:
        - $ref: '#/components/schemas/UserRead'
        - type: object
          required:
            - is_admin
            - failed_login_attempts
            - created_at
            - updated_at
          properties:
            is_admin:
              type: boolean
            failed_login_attempts:
              type: integer
              minimum: 0
            locked_until:
              type:
                - string
                - 'null'
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    UserStatusUpdate:
      type: object
      required:
        - is_active
      properties:
        is_active:
          type: boolean
    UserRoleUpdate:
      type: object
      required:
        - is_admin
      properties:
        is_admin:
          type: boolean
    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    Token:
      type: object
      required:
        - access_token
        - token_type
        - expiresIn
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        expiresIn:
          type: integer
          minimum: 1
    ImportMode:
      type: string
      enum:
        - standard
        - full
      description: |
        standard: importe uniquement ms_task et ms_task_link.
        full: reserve a une phase ulterieure (ressources/affectations).
    BatchStatus:
      type: string
      enum:
        - pending
        - running
        - success
        - failed
    SourceVersion:
      type: integer
      enum:
        - 2010
        - 2013
        - 2016
      description: Version source detectee/annoncee du XML MS Project
    ImportBatchCreateRequest:
      type: object
      required:
        - projectId
        - importMode
      properties:
        projectId:
          type: integer
          minimum: 1
          description: Projet cible, appartenant à l'utilisateur authentifié
        importMode:
          $ref: '#/components/schemas/ImportMode'
        sourceName:
          type: string
          maxLength: 255
          description: Nom logique de la source ou du planning
    ImportBatchResponse:
      type: object
      required:
        - id
        - importMode
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
        importMode:
          $ref: '#/components/schemas/ImportMode'
        status:
          $ref: '#/components/schemas/BatchStatus'
        sourceName:
          type:
            - string
            - 'null'
        sourceVersion:
          $ref: '#/components/schemas/SourceVersion'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        endedAt:
          type:
            - string
            - 'null'
          format: date-time
        errorMessage:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ImportRunRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
          description: Valide le fichier sans persister en base (optionnel)
        confirm:
          type: boolean
          default: false
          description: Confirme l'application du diff
    ImportDiffItem:
      type: object
      required:
        - kind
        - uid
        - message
        - fields
      properties:
        kind:
          type: string
          enum:
            - added
            - modified
            - removed
            - conflict
            - calendar_mismatch
        uid:
          type: integer
          minimum: 1
        message:
          type: string
        fields:
          type: array
          items:
            type: string
        linkChanges:
          type: array
          items:
            $ref: '#/components/schemas/ImportLinkChange'
        calendarMismatch:
          anyOf:
            - $ref: '#/components/schemas/ImportCalendarMismatch'
            - type: 'null'
    ImportLinkChange:
      type: object
      required:
        - action
        - taskUid
        - predecessorUid
        - linkType
      properties:
        action:
          type: string
          enum:
            - added
            - removed
        taskUid:
          type: integer
        predecessorUid:
          type: integer
        linkType:
          type: integer
        lagTenthMinute:
          type:
            - integer
            - 'null'
        lagFormat:
          type:
            - integer
            - 'null'
    ImportDiffResponse:
      type: object
      required:
        - batchId
        - identicalSource
        - items
      properties:
        batchId:
          type: integer
          minimum: 1
        sourceSha256:
          type:
            - string
            - 'null'
        identicalSource:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportDiffItem'
    ImportRunAcceptedResponse:
      type: object
      required:
        - batchId
        - status
        - acceptedAt
      properties:
        batchId:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/BatchStatus'
        acceptedAt:
          type: string
          format: date-time
    ImportCounters:
      type: object
      required:
        - tasks
        - links
      properties:
        tasks:
          type: integer
          minimum: 0
        links:
          type: integer
          minimum: 0
    ImportBatchStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ImportBatchResponse'
        - type: object
          properties:
            projectId:
              type:
                - integer
                - 'null'
              minimum: 1
              description: ms_project.id cree par l'import
            counters:
              $ref: '#/components/schemas/ImportCounters'
            warnings:
              type: array
              items:
                $ref: '#/components/schemas/ImportIssue'
    ImportIssue:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ORPHAN_PREDECESSOR
        message:
          type: string
        taskUid:
          type:
            - integer
            - 'null'
        predecessorUid:
          type:
            - integer
            - 'null'
    ImportErrorListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
    FastAPIErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          anyOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
    ProjectRead:
      type: object
      required:
        - id
        - name
        - status
        - source_version
        - save_version_out
        - schedule_from_start
        - minutes_per_day
        - minutes_per_week
        - days_per_month
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        status:
          type: string
          enum:
            - cree
            - initialise
            - en_reponse_appel_offre
            - perdu
            - en_cours
            - termine
            - abandonne
        code:
          type:
            - string
            - 'null'
        short_description:
          type:
            - string
            - 'null'
        source_version:
          type: integer
          enum:
            - 2010
            - 2013
            - 2016
        save_version_out:
          type: integer
          enum:
            - 14
            - 15
            - 16
        schedule_from_start:
          type: boolean
        start_date:
          type:
            - string
            - 'null'
          format: date-time
        finish_date:
          type:
            - string
            - 'null'
          format: date-time
        minutes_per_day:
          type: integer
        minutes_per_week:
          type: integer
        days_per_month:
          type: integer
        currency_code:
          type:
            - string
            - 'null'
        planning_reference_id:
          type:
            - integer
            - 'null'
        displayed_planning_id:
          type:
            - integer
            - 'null'
        reference_estimate_id:
          type:
            - integer
            - 'null'
    ProjectCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type:
            - string
            - 'null'
          maxLength: 64
        short_description:
          type:
            - string
            - 'null'
          maxLength: 500
        currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type:
            - string
            - 'null'
          maxLength: 64
        short_description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          type: string
          enum:
            - cree
            - initialise
            - en_reponse_appel_offre
            - perdu
            - en_cours
            - termine
            - abandonne
    ProjectStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - cree
            - initialise
            - en_reponse_appel_offre
            - perdu
            - en_cours
            - termine
            - abandonne
    PlanningRead:
      type: object
      required:
        - id
        - project_id
        - version_number
        - status
        - revision
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        version_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - draft
            - validated
            - superseded
        revision:
          type: integer
          minimum: 0
        note:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        validated_at:
          type:
            - string
            - 'null'
          format: date-time
    PlanningCreate:
      type: object
      properties:
        note:
          type:
            - string
            - 'null'
          maxLength: 10000
        source_planning_id:
          type:
            - integer
            - 'null'
          minimum: 1
    PlanningTaskMove:
