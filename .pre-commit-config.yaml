default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # Fast gates run on commit, scoped to backend Python only.
      - id: ruff-check
        name: ruff-check
        entry: bash -c 'cd apps/backend && ruff check .'
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$
      - id: ruff-format
        name: ruff-format
        entry: bash -c 'cd apps/backend && ruff format --check .'
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$
      - id: pyright
        name: pyright
        entry: bash -c 'cd apps/backend && pyright'
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$
      # Heavy gate runs once on push (coverage stays CI-only).
      - id: pytest
        name: pytest
        entry: bash -c 'cd apps/backend && pytest -q --no-cov'
        language: system
        pass_filenames: false
        files: ^(apps/backend/|openapi/)
        stages: [pre-push]
