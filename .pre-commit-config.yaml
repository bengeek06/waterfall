repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
        args: [--fix, --config=apps/backend/pyproject.toml]
      - id: ruff-format
        args: [--config=apps/backend/pyproject.toml]
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c 'cd apps/backend && pyright'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd apps/backend && pytest -q'
        language: system
        pass_filenames: false
