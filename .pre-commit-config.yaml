repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: bash -c 'cd apps/backend && ruff check --fix .'
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: bash -c 'cd apps/backend && ruff format .'
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: bash -c 'cd apps/backend && pyright'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd apps/backend && pytest -q'
        language: system
        pass_filenames: false
