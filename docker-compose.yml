services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://waterfall:waterfall@postgres:5432/waterfall
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: waterfall
      POSTGRES_USER: waterfall
      POSTGRES_PASSWORD: waterfall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterfall -d waterfall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
