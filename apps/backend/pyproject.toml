[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waterfall"
version = "0.1.0"
description = "Professional FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Waterfall Team" }]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.16.0",
  "pydantic-settings>=2.10.0",
  "python-json-logger>=3.2.0",
  "python-jose[cryptography]>=3.3.0",
  "pwdlib[argon2]>=0.3.0",
  "python-multipart>=0.0.20",
  "prometheus-client>=0.22.1",
  "email-validator>=2.2.0",
  "openpyxl>=3.1.0",
  "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
  "pyright>=1.1.0",
  "pre-commit>=3.8.0",
  "PyYAML>=6.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
waterfall = "waterfall.main:app"
waterfall-seed-admin = "waterfall.scripts.seed_admin:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=src/waterfall --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/waterfall"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
