services:
  api:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql+psycopg://waterfall:waterfall@postgres:5432/waterfall
      IMPORT_STORAGE_PATH: /data/imports
      WF_ADMIN_EMAIL: ${WF_ADMIN_EMAIL:-admin@example.com}
      WF_ADMIN_IS_ACTIVE: ${WF_ADMIN_IS_ACTIVE:-true}
      WF_ADMIN_PASSWORD: ${WF_ADMIN_PASSWORD:?WF_ADMIN_PASSWORD must be set}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - import_data:/data/imports

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: waterfall
      POSTGRES_USER: waterfall
      POSTGRES_PASSWORD: waterfall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterfall -d waterfall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  import_data:
