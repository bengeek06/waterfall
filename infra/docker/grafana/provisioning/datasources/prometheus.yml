apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned rather than left implicit: the provisioned dashboards (../dashboards/*.json)
    # address their datasource by uid. Without this line Grafana derives the uid from the
    # datasource *name* -- "Prometheus" happens to hash to PBFA97CFB590B2093, reproducibly
    # across volumes -- but that derivation is an internal implementation detail, not a
    # contract: renaming this datasource would silently repoint every dashboard target at a
    # uid that no longer exists ("Datasource <uid> was not found" on all 19 of them).
    # Changing this value means changing it in ../dashboards/*.json too.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Same reasoning as `allowUiUpdates: false` on the dashboard provider: datasource
    # provisioning only replays at startup, so a UI edit would survive until the next
    # restart and `grafana_data` would become a second source of truth -- for the very uid
    # the 19 dashboard targets depend on. This file stays the only place it is defined.
    editable: false
