services:
  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      # service_healthy, not service_started: the API process binds its port well before
      # `alembic upgrade head` and its dependencies are usable, so the frontend used to
      # come up against an API that answered 500s. /health/ready is what actually knows.
      #
      # Startup ordering only. Compose never stops or restarts an already-running
      # dependent when `api` later flips to unhealthy, so this buys an orderly boot, not
      # supervision. It does change a failure mode: `docker compose up --wait` (and any
      # CI using it) now blocks until the API is ready and gives up after roughly
      # start_period + retries x interval -- about 150s with the values in
      # docker-compose.yml -- if Postgres, Redis or Garage never comes back.
      api:
        condition: service_healthy

  db-viewer:
    image: dpage/pgadmin4:8
    environment:
      # pgAdmin validates this address and rejects a .local TLD, exiting 1 at startup.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      # Same reason as the frontend, and with the same two caveats: scraping /metrics on
      # an API that is up but not ready produces a stretch of misleading series at every
      # startup, but this only orders the boot -- Prometheus keeps running (and keeps
      # scraping, which is what you want) if the API goes unhealthy afterwards.
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Dashboards provisionnés au démarrage : le provider (dashboards.yml) et les
      # dashboards eux-mêmes (*.json) vivent dans le même répertoire, monté en lecture
      # seule pour que `grafana_data` ne puisse pas devenir une seconde source de vérité.
      # Supprimer le volume et relancer restaure les deux dashboards à l'identique.
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgadmin_data:
  prometheus_data:
  grafana_data:
